name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch fonts
        run: bash scripts/fetch-fonts.sh

      - name: Create signing key (first build only)
        run: |
          if [ ! -f signing/reelcount.p12 ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/reelcount.p12 -storetype PKCS12 \
              -alias reelcount -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass reelcount -keypass reelcount -dname "CN=ReelCount"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/reelcount.p12
            git commit -m "Add signing key so updates install over the previous APK"
            git push
          fi

      - name: Build
        run: gradle :app:assembleRelease --no-daemon

      - run: cp app/build/outputs/apk/release/app-release.apk ReelCount.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReelCount
          path: ReelCount.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ReelCount build ${{ github.run_number }}
          files: ReelCount.apk
